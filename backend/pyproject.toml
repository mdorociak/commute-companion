[project]
name = "commuter-backend"
version = "0.1.0"
description = "Backend API aggregating KD and MPK transit data for the Brzeg commuter app"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "gtfs-realtime-bindings>=1.0.0"
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "tzdata>=2024.1",
    "ruff>=0.16"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
# DTZ (flake8-datetimez) is the point of this selection: naive datetimes in
# transport calculations are this project's highest-risk defect class, and the
# linter catches them earlier and more cheaply than a test can. The remaining
# sets are low-noise correctness and consistency rules.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "DTZ", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
